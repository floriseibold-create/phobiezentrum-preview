name: Publish preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Mirror current preview
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site
          wget \
            --recursive \
            --level=inf \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --no-host-directories \
            --directory-prefix=site \
            --execute robots=off \
            https://mareika.netlify.app/

          # GitHub Pages should serve the mirrored files as-is.
          touch site/.nojekyll

          # Preview must not be indexed by search engines.
          cat > site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

          # Belt-and-suspenders: add noindex to any mirrored HTML that lacks it.
          python3 - <<'PY'
          from pathlib import Path
          marker = '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">'
          for p in Path('site').rglob('*.html'):
              text = p.read_text(encoding='utf-8', errors='ignore')
              if 'name="robots"' not in text.lower():
                  text = text.replace('<head>', '<head>' + marker, 1)
                  p.write_text(text, encoding='utf-8')
          PY

          echo 'Mirrored files:'
          find site -maxdepth 3 -type f | sort | head -200

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
