name: Publish preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private website source
        uses: actions/checkout@v4
        with:
          repository: floriseibold-create/phobiezentrum-website
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Build website
        working-directory: source
        run: |
          npm run build
          BASE_PATH=phobiezentrum-preview node pages-prepare.js

      - name: Ensure preview stays out of search engines
        run: |
          cat > source/dist/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          touch source/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
